name: Deploy to VPS

on:
  push:
    branches: [vps]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 644 "$RUNNER_TEMP/deploy_key"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            mkdir -p /opt/automationgini
            cd /opt/automationgini
            if [ ! -d .git ]; then
              git clone -b vps https://github.com/Nabeel-Usmani/automationgini-website.git .
            else
              git fetch origin vps
              git reset --hard origin/vps
            fi

            clone_or_update() {
              dir="$1"; repo="$2"; branch="$3"
              if [ ! -d "$dir/.git" ]; then
                rm -rf "$dir"
                git clone -b "$branch" "https://github.com/$repo.git" "$dir"
              else
                git -C "$dir" fetch origin "$branch"
                git -C "$dir" reset --hard "origin/$branch"
              fi
            }

            clone_or_update api Nabeel-Usmani/automationgini-api main
            clone_or_update crm Nabeel-Usmani/automationgini-crmv2 main
            clone_or_update website Nabeel-Usmani/automationgini-website claude/logo-transparency-background-859l4q

            cat > .env <<EOF
            POSTGRES_USER=n8n
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            N8N_ENCRYPTION_KEY=${{ secrets.N8N_ENCRYPTION_KEY }}
            N8N_HOST=app.automationgini.com
            N8N_PROTOCOL=https
            WEBHOOK_URL=https://app.automationgini.com/
            GENERIC_TIMEZONE=UTC
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            docker compose -f docker-compose.yml --env-file .env up -d --build --remove-orphans

            # docker compose only recreates a container when ITS OWN config
            # changes - a bind-mounted file (the Caddyfile) changing content
            # on disk doesn't count, so the running Caddy process would
            # otherwise keep serving whatever config it started with. Force
            # a reload every deploy so Caddyfile edits always take effect.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

            echo "Waiting for postgres..."
            for i in $(seq 1 30); do
              docker compose exec -T postgres pg_isready -U n8n >/dev/null 2>&1 && break
              sleep 2
            done

            docker compose exec -T postgres psql -U n8n -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='automationgini'" | grep -q 1 || \
              docker compose exec -T postgres psql -U n8n -d postgres -c "CREATE DATABASE automationgini"

            for f in $(ls api/migrations/*.sql | sort); do
              echo "Applying $f"
              cat "$f" | docker compose exec -T postgres psql -U n8n -d automationgini
            done

            docker image prune -f
